<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PulseGate Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f6;color:#161823;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(1080px,calc(100% - 28px));margin:auto;padding:24px 0 50px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}h1{margin:0;font-size:25px}.actions{display:flex;gap:8px}button{border:0;border-radius:9px;padding:10px 13px;font-weight:650;cursor:pointer}.primary{background:#fe2c55;color:#fff}.panel{padding:18px;margin-bottom:18px;border:1px solid #e7e7e9;border-radius:18px;background:#fff;box-shadow:0 8px 28px rgba(22,24,35,.05)}.grid{display:grid;grid-template-columns:1.1fr 1.1fr 1fr auto;gap:10px}input,select{width:100%;height:43px;padding:0 11px;border:1px solid #ddd;border-radius:9px;background:#fafafa}.custom{display:none;margin-top:10px}.msg{min-height:18px;margin-top:8px;color:#fe2c55;font-size:12px}.users{display:grid;gap:10px}.user{display:grid;grid-template-columns:1fr 1fr 1.2fr auto;gap:10px;align-items:center;padding:14px;border:1px solid #eee;border-radius:13px}.meta{font-size:12px;color:#777}.password{font-family:monospace}.user-buttons{display:flex;flex-wrap:wrap;gap:5px}.user-buttons button{padding:7px 9px;font-size:11px;background:#f1f1f2}.user-buttons .danger{color:#fff;background:#e41e45}@media(max-width:760px){.grid,.user{grid-template-columns:1fr}.user-buttons{margin-top:5px}}</style></head><body><div class="wrap"><header><div><h1>Access manager</h1><div class="meta">Create users and control their access time</div></div><div class="actions"><button onclick="location.href='/'">Open app</button><button id="logout">Log out</button></div></header><section class="panel"><h3>Create user</h3><form class="grid" id="create"><input id="newUser" placeholder="Username" required><input id="newPass" placeholder="Password" required><select id="duration"><option value="600000">10 minutes</option><option value="86400000">1 day</option><option value="604800000">1 week</option><option value="2592000000">1 month</option><option value="5184000000">2 months</option><option value="7776000000">3 months</option><option value="custom">Custom</option></select><button class="primary">Create</button></form><input class="custom" id="customMinutes" type="number" min="1" placeholder="Custom access in minutes"><div class="msg" id="msg"></div></section><section class="panel"><h3>Users</h3><div class="users" id="users"></div></section></div><script>
const token=localStorage.getItem('walletAuthToken'),headers={'Content-Type':'application/json',Authorization:`Bearer ${token}`};duration.onchange=()=>customMinutes.style.display=duration.value==='custom'?'block':'none';const remaining=x=>{const ms=x-Date.now();if(ms<=0)return'Expired';if(ms<3600000)return`${Math.ceil(ms/60000)} min left`;if(ms<86400000)return`${Math.ceil(ms/3600000)} hr left`;return`${Math.ceil(ms/86400000)} days left`};async function api(url,opt={}){const r=await fetch(url,{...opt,headers});const d=await r.json();if(!r.ok)throw new Error(d.error);return d}async function load(){try{const list=await api('/api/admin/users');users.innerHTML='';list.forEach(u=>{const row=document.createElement('div');row.className='user';row.innerHTML=`<div><b>${u.username}</b><div class="meta">${remaining(u.expiresAt)}</div></div><div class="password">Password: ${u.password}</div><div class="meta">Expires: ${new Date(u.expiresAt).toLocaleString()}</div><div class="user-buttons"><button data-a="pass">Change password</button><button data-a="add">+ Time</button><button data-a="reduce">- Time</button><button data-a="remove" class="danger">Remove</button></div>`;row.onclick=async e=>{const a=e.target.dataset.a;if(!a)return;try{if(a==='remove')await api(`/api/admin/users/${u.id}`,{method:'DELETE'});else if(a==='pass'){const p=prompt('New password');if(p)await api(`/api/admin/users/${u.id}`,{method:'PUT',body:JSON.stringify({password:p})})}else{const mins=Number(prompt(`${a==='add'?'Add':'Reduce'} how many minutes?`));if(mins)await api(`/api/admin/users/${u.id}`,{method:'PUT',body:JSON.stringify({adjustMs:(a==='add'?1:-1)*mins*60000})})}load()}catch(x){alert(x.message)}};users.append(row)})}catch{location.replace('/login.html')}}create.onsubmit=async e=>{e.preventDefault();msg.textContent='';try{const durationMs=duration.value==='custom'?Number(customMinutes.value)*60000:Number(duration.value);await api('/api/admin/users',{method:'POST',body:JSON.stringify({username:newUser.value,password:newPass.value,durationMs})});create.reset();customMinutes.style.display='none';load()}catch(x){msg.textContent=x.message}};logout.onclick=async()=>{try{await api('/api/logout',{method:'POST'})}catch{}localStorage.removeItem('walletAuthToken');location.replace('/login.html')};load();
</script></body></html>
