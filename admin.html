<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07120f"><title>Coin Exchanger — Admin</title><style>
:root{--ink:#f4fff9;--muted:#8fa79d;--surface:rgba(14,31,25,.88);--line:rgba(135,255,196,.12);--green:#45f59b;--green2:#20c978;--danger:#ff687c}*{box-sizing:border-box}body{margin:0;min-height:100svh;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 8% 0,rgba(69,245,155,.16),transparent 34%),radial-gradient(circle at 100% 85%,rgba(26,139,95,.18),transparent 32%),#07120f}button,input,select{font:inherit}.wrap{width:min(1160px,calc(100% - 32px));margin:auto;padding:32px 0 64px}.topbar,.brand,.actions,.panel-head{display:flex;align-items:center}.topbar{justify-content:space-between;gap:18px;margin-bottom:24px}.brand{gap:14px}.mark{display:grid;place-items:center;width:48px;height:48px;border:1px solid rgba(69,245,155,.28);border-radius:15px;background:linear-gradient(145deg,rgba(69,245,155,.22),rgba(69,245,155,.05));color:var(--green)}.mark svg{width:25px}.eyebrow{margin:0 0 4px;color:var(--green);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{margin:0;font-size:clamp(25px,4vw,34px);letter-spacing:-1px}.actions{gap:9px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 15px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.055);color:var(--ink);font-weight:750;cursor:pointer;transition:.2s}.btn:hover{border-color:rgba(69,245,155,.35);background:rgba(69,245,155,.09);transform:translateY(-1px)}.btn.primary{border:0;background:linear-gradient(135deg,var(--green),var(--green2));color:#032a19;box-shadow:0 12px 24px rgba(32,201,120,.2)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.stat,.panel{border:1px solid var(--line);background:var(--surface);box-shadow:0 24px 70px rgba(0,0,0,.35);backdrop-filter:blur(18px)}.stat{padding:18px;border-radius:17px}.stat-label,.meta,.panel-copy{color:var(--muted);font-size:12px}.stat-value{margin-top:6px;font-size:24px;font-weight:800}.online{color:var(--green)}.panel{padding:22px;margin-bottom:18px;border-radius:22px}.panel-head{justify-content:space-between;margin-bottom:18px}.panel h2{margin:0;font-size:18px}.panel-copy{margin:5px 0 0}.form-grid{display:grid;grid-template-columns:1fr 1fr .9fr auto;gap:11px;align-items:end}.field label{display:block;margin:0 0 7px;color:#b8cac2;font-size:11px;font-weight:750;letter-spacing:.05em;text-transform:uppercase}.field input,.field select{width:100%;height:46px;padding:0 13px;border:1px solid var(--line);border-radius:12px;outline:0;background:rgba(3,16,11,.62);color:var(--ink)}.field input::placeholder{color:#698077}.field input:focus,.field select:focus{border-color:rgba(69,245,155,.65);box-shadow:0 0 0 3px rgba(69,245,155,.1)}.custom-row{display:none;grid-template-columns:1fr 160px;gap:10px;margin-top:12px}.custom-row.open{display:grid}.msg{min-height:18px;margin-top:10px;color:var(--danger);font-size:12px}.users{display:grid;gap:10px}.empty{padding:34px 18px;border:1px dashed rgba(135,255,196,.17);border-radius:16px;color:var(--muted);text-align:center}.user{display:grid;grid-template-columns:minmax(145px,1fr) minmax(150px,.9fr) minmax(190px,1.15fr) auto;gap:14px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:16px;background:rgba(3,16,11,.44)}.user:hover{border-color:rgba(69,245,155,.25)}.user-name{font-weight:800}.status{display:inline-flex;align-items:center;gap:6px;margin-top:6px;color:var(--green);font-size:11px}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}.status.expired{color:var(--danger)}.meta{line-height:1.5}.password{color:#c8d9d1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.user-buttons{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}.user-buttons button{min-height:34px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.055);color:#dcebe4;font-size:11px;font-weight:700;cursor:pointer}.user-buttons .danger{color:#ff8999;background:rgba(255,90,112,.09)}@media(max-width:820px){.form-grid,.user{grid-template-columns:1fr 1fr}.user-buttons{justify-content:flex-start}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}}@media(max-width:560px){.wrap{width:min(100% - 22px,1160px);padding-top:18px}.topbar{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.stats,.form-grid,.user,.custom-row{grid-template-columns:1fr}.stats .stat:last-child{grid-column:auto}.panel{padding:17px}.user-buttons button{flex:1}}
</style></head><body><div class="wrap"><header class="topbar"><div class="brand"><div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 7h11l-3-3m3 3-3 3M17 17H6l3 3m-3-3 3-3"/></svg></div><div><p class="eyebrow">Coin Exchanger</p><h1>Access control</h1></div></div><div class="actions"><button class="btn" onclick="location.href='/'">Open app</button><button class="btn" id="logout">Log out</button></div></header><section class="stats"><div class="stat"><div class="stat-label">Managed accounts</div><div class="stat-value" id="userCount">—</div></div><div class="stat"><div class="stat-label">Active access</div><div class="stat-value online" id="activeCount">—</div></div><div class="stat"><div class="stat-label">Service</div><div class="stat-value online">Online</div></div></section><section class="panel"><div class="panel-head"><div><h2>Create account</h2><p class="panel-copy">Issue secure, time-limited access to a new user.</p></div></div><form class="form-grid" id="create"><div class="field"><label for="newUser">Username</label><input id="newUser" placeholder="e.g. creator_01" autocomplete="off" required></div><div class="field"><label for="newPass">Password</label><input id="newPass" type="password" placeholder="Minimum 4 characters" autocomplete="new-password" required></div><div class="field"><label for="duration">Access period</label><select id="duration"><option value="600000">10 minutes</option><option value="3600000">1 hour</option><option value="86400000">1 day</option><option value="604800000">1 week</option><option value="2592000000">1 month</option><option value="5184000000">2 months</option><option value="7776000000">3 months</option><option value="custom">Custom time</option></select></div><button class="btn primary">Create account</button></form><div class="custom-row" id="customRow"><div class="field"><label for="customAmount">Custom amount</label><input id="customAmount" type="number" min="1" value="30"></div><div class="field"><label for="customUnit">Unit</label><select id="customUnit"><option value="60000">Minutes</option><option value="3600000">Hours</option><option value="86400000">Days</option><option value="604800000">Weeks</option></select></div></div><div class="msg" id="msg" role="status"></div></section><section class="panel"><div class="panel-head"><div><h2>Managed users</h2><p class="panel-copy">Passwords stay hidden. Change access or credentials at any time.</p></div></div><div class="users" id="users"><div class="empty">Loading accounts…</div></div></section></div><script>
const token=localStorage.getItem('walletAuthToken'),headers={'Content-Type':'application/json',Authorization:`Bearer ${token}`};duration.onchange=()=>customRow.classList.toggle('open',duration.value==='custom');const remaining=x=>{const ms=x-Date.now();if(ms<=0)return'Expired';if(ms<3600000)return`${Math.ceil(ms/60000)} min left`;if(ms<86400000)return`${Math.ceil(ms/3600000)} hr left`;return`${Math.ceil(ms/86400000)} days left`};async function api(url,opt={}){const r=await fetch(url,{...opt,headers});const d=await r.json();if(!r.ok)throw new Error(d.error);return d}async function load(){try{const list=await api('/api/admin/users');users.innerHTML='';userCount.textContent=list.length;activeCount.textContent=list.filter(u=>u.expiresAt>Date.now()).length;if(!list.length){users.innerHTML='<div class="empty">No user accounts yet. Create one above.</div>';return}list.forEach(u=>{const expired=u.expiresAt<=Date.now(),row=document.createElement('div');row.className='user';row.innerHTML=`<div><div class="user-name">${u.username}</div><div class="status ${expired?'expired':''}">${remaining(u.expiresAt)}</div></div><div class="password">Password: ${u.password}</div><div class="meta">Access ends<br><strong>${new Date(u.expiresAt).toLocaleString()}</strong></div><div class="user-buttons"><button data-a="pass">Password</button><button data-a="add">+ Time</button><button data-a="reduce">− Time</button><button data-a="remove" class="danger">Remove</button></div>`;row.onclick=async e=>{const a=e.target.dataset.a;if(!a)return;try{if(a==='remove'){if(confirm(`Remove ${u.username}?`))await api(`/api/admin/users/${u.id}`,{method:'DELETE'})}else if(a==='pass'){const p=prompt('Enter a new password');if(p)await api(`/api/admin/users/${u.id}`,{method:'PUT',body:JSON.stringify({password:p})})}else{const mins=Number(prompt(`${a==='add'?'Add':'Reduce'} how many minutes?`));if(mins)await api(`/api/admin/users/${u.id}`,{method:'PUT',body:JSON.stringify({adjustMs:(a==='add'?1:-1)*mins*60000})})}load()}catch(x){alert(x.message)}};users.append(row)})}catch{location.replace('/login.html')}}create.onsubmit=async e=>{e.preventDefault();msg.textContent='';try{const durationMs=duration.value==='custom'?Number(customAmount.value)*Number(customUnit.value):Number(duration.value);if(!Number.isFinite(durationMs)||durationMs<60000)throw new Error('Custom access must be at least one minute.');await api('/api/admin/users',{method:'POST',body:JSON.stringify({username:newUser.value,password:newPass.value,durationMs})});create.reset();customRow.classList.remove('open');customAmount.value=30;msg.style.color='var(--green)';msg.textContent='Account created successfully.';load()}catch(x){msg.style.color='var(--danger)';msg.textContent=x.message}};logout.onclick=async()=>{try{await api('/api/logout',{method:'POST'})}catch{}localStorage.removeItem('walletAuthToken');location.replace('/login.html')};load();
</script></body></html>
