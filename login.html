<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07120f"><title>Coin Exchanger — Sign in</title><link rel="icon" href="assets/tiktok-icon-192.png"><style>
:root{--green:#45f59b;--green2:#20c978;--ink:#f4fff9;--muted:#91a99f;--line:rgba(135,255,196,.14)}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:20px;overflow-x:hidden;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 12% 8%,rgba(69,245,155,.2),transparent 32%),radial-gradient(circle at 90% 88%,rgba(32,201,120,.15),transparent 34%),#07120f}.card{position:relative;width:min(100%,420px);padding:31px 27px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(17,38,30,.95),rgba(8,24,18,.91));box-shadow:0 30px 90px rgba(0,0,0,.48);backdrop-filter:blur(22px);animation:enter .6s cubic-bezier(.2,.9,.25,1)}@keyframes enter{from{opacity:0;transform:translateY(22px) scale(.97)}}.gear{position:absolute;right:20px;top:20px;width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.06);color:#eafff3;font-size:18px;cursor:pointer;transition:.25s}.gear:hover{transform:rotate(45deg);background:rgba(69,245,155,.1)}.logo{width:66px;height:66px;border:1px solid rgba(69,245,155,.25);border-radius:19px;object-fit:cover;box-shadow:0 12px 35px rgba(32,201,120,.18)}.kicker{margin:19px 0 5px;color:var(--green);font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}h1{margin:0 0 9px;font-size:32px;letter-spacing:-1px}.intro{margin:0 0 24px;color:var(--muted);font-size:14px;line-height:1.55}.field{margin-bottom:14px}.field label{display:block;margin:0 0 7px;color:#bdd0c7;font-size:11px;font-weight:750;letter-spacing:.05em;text-transform:uppercase}.field input,.field select{width:100%;height:50px;padding:0 14px;border:1px solid var(--line);border-radius:13px;outline:0;background:rgba(1,15,10,.58);color:var(--ink);font-size:15px;transition:.2s}.field input:focus,.field select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(69,245,155,.12);background:rgba(1,15,10,.8)}.password-wrap{position:relative}.password-wrap input{padding-right:56px}.toggle-password{position:absolute;right:7px;top:50%;display:grid;place-items:center;width:38px;height:38px;padding:0;transform:translateY(-50%);border:0;border-radius:9px;background:transparent;color:#8fa79d;cursor:pointer}.toggle-password:hover,.toggle-password:focus-visible{outline:0;background:rgba(69,245,155,.1);color:var(--green)}.toggle-password svg{width:20px;height:20px}.eye-off,.toggle-password[aria-pressed="true"] .eye-on{display:none}.toggle-password[aria-pressed="true"] .eye-off{display:block}.login{width:100%;height:50px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--green),var(--green2));color:#032a19;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 12px 28px rgba(32,201,120,.24)}.login:active{transform:scale(.985)}.login:disabled{opacity:.65;cursor:wait}.error{min-height:20px;margin-top:9px;color:#ff7e90;font-size:12px;text-align:center}.contact{width:100%;border:0;background:none;color:var(--green);font-weight:700;cursor:pointer}.contacts{display:none;margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.05);color:#bdd0c7;font-size:13px;line-height:1.8}.contacts.open{display:block}.contacts a{color:var(--ink);text-decoration:none}.admin-note{margin-top:17px;color:#60786e;font-size:10px;text-align:center}.settings-overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:16px;background:rgba(0,8,5,.74);opacity:0;visibility:hidden;transition:.25s}.settings-overlay.open{opacity:1;visibility:visible}.settings-sheet{width:min(100%,440px);max-height:90svh;overflow:auto;padding:22px;border:1px solid var(--line);border-radius:25px;background:#10241c;box-shadow:0 28px 80px rgba(0,0,0,.5);transform:translateY(30px);transition:.3s}.settings-overlay.open .settings-sheet{transform:none}.settings-head,.settings-grid{display:flex}.settings-head{align-items:center;justify-content:space-between;margin-bottom:18px}.settings-head h2{margin:0}.close-settings{width:35px;height:35px;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.06);color:var(--ink);cursor:pointer}.settings-grid{gap:12px}.settings-grid .field{flex:1}.color-input{padding:5px!important}.settings-note{color:var(--muted);font-size:12px;line-height:1.5}@media(max-width:460px){body{padding:13px}.card{padding:27px 20px;border-radius:24px}h1{font-size:28px}.settings-grid{display:block}}
</style></head><body><main class="card"><button class="gear" id="gear" aria-label="Open display settings">⚙</button><img class="logo" src="assets/tiktok-logo.webp" alt="Coin Exchanger"><p class="kicker">Secure exchange access</p><h1>Coin Exchanger</h1><p class="intro">Sign in to your exchange workspace. Your account is protected by administrator-managed timed access.</p><form id="form"><div class="field"><label for="username">Username</label><input id="username" autocomplete="username" required></div><div class="field"><label for="password">Password</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" required><button class="toggle-password" id="togglePassword" type="button" aria-label="Show password" aria-pressed="false"><svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.7"/></svg><svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 3 18 18M10.6 6.1A9.8 9.8 0 0 1 12 6c6 0 9.5 6 9.5 6a16 16 0 0 1-2.2 2.8M6.2 6.2C3.8 8 2.5 12 2.5 12s3.5 6 9.5 6c1.2 0 2.3-.2 3.3-.6"/></svg></button></div></div><button class="login">Log in</button><div class="error" id="error"></div></form><button class="contact" id="contact">Contact admin</button><div class="contacts" id="contacts"><div>Instagram: <a href="https://instagram.com/fimpong34" target="_blank" rel="noopener noreferrer">@fimpong34</a></div><div>  </div></div><div class="admin-note">Use the gear to customize your exchange display</div></main><div class="settings-overlay" id="settingsOverlay"><section class="settings-sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><div class="settings-head"><h2 id="settingsTitle">Display settings</h2><button class="close-settings" id="closeSettings" aria-label="Close settings">✕</button></div><div class="settings-grid"><div class="field"><label>Balance amount ($)</label><input id="settingUsd" type="number" min="0" step="0.01"></div><div class="field"><label>Coin balance</label><input id="settingCoins" type="number" min="0" step="1"></div></div><div class="settings-grid"><div class="field"><label>Loading color 1</label><input class="color-input" id="settingColorOne" type="color"></div><div class="field"><label>Loading color 2</label><input class="color-input" id="settingColorTwo" type="color"></div></div><div class="field"><label>Loading animation</label><select id="settingLoader"><option value="spinner">Spinning circle</option><option value="dots">Bouncing dots</option><option value="pulse">Pulse circle</option></select></div><p class="settings-note">Saved on this device and applied after login.</p><button class="login" id="saveSettings" type="button">Save settings</button></section></div><script>
const SETTINGS_KEY='walletDisplaySettings',pageParams=new URLSearchParams(location.search),openedFromApp=pageParams.get('settings')==='1',defaults={usd:8573020.22,coins:706416866,colorOne:'#45f59b',colorTwo:'#20c978',loader:'spinner'},getSettings=()=>{try{return{...defaults,...JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}}catch{return{...defaults}}};function openSettings(){const s=getSettings();settingUsd.value=s.usd;settingCoins.value=s.coins;settingColorOne.value=s.colorOne;settingColorTwo.value=s.colorTwo;settingLoader.value=s.loader;settingsOverlay.classList.add('open')}function closeSettingsPanel(){settingsOverlay.classList.remove('open');if(openedFromApp&&localStorage.getItem('walletAuthToken'))location.replace('/')}if(pageParams.get('reason')==='session-ended')error.textContent='Your session ended. Please sign in again.';togglePassword.onclick=()=>{const showing=password.type==='text';password.type=showing?'password':'text';togglePassword.setAttribute('aria-label',showing?'Show password':'Hide password');togglePassword.setAttribute('aria-pressed',String(!showing));password.focus()};contact.onclick=()=>contacts.classList.toggle('open');gear.onclick=openSettings;closeSettings.onclick=closeSettingsPanel;settingsOverlay.onclick=e=>{if(e.target===settingsOverlay)closeSettingsPanel()};saveSettings.onclick=()=>{const usd=Math.max(0,Number(settingUsd.value)),coins=Math.max(0,Math.floor(Number(settingCoins.value)));localStorage.setItem(SETTINGS_KEY,JSON.stringify({usd:Number.isFinite(usd)?usd:defaults.usd,coins:Number.isFinite(coins)?coins:defaults.coins,colorOne:settingColorOne.value,colorTwo:settingColorTwo.value,loader:settingLoader.value}));saveSettings.textContent='Saved ✓';setTimeout(()=>{saveSettings.textContent='Save settings';closeSettingsPanel()},550)};if(openedFromApp)openSettings();form.onsubmit=async e=>{e.preventDefault();error.textContent='';const button=e.submitter;button.disabled=true;button.textContent='Signing in…';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})}),d=await r.json();if(!r.ok)throw new Error(d.error);localStorage.setItem('walletAuthToken',d.token);location.href=d.user.role==='admin'?'/admin.html':'/'}catch(x){error.textContent=x.message}finally{button.disabled=false;button.textContent='Log in'}};
</script></body></html>
